# Shared ViT and multi-slice voting configuration.
# The classifier reads already fused three-channel RGB PNG files. The meaning of
# the RGB channels is determined by the modality-combination preprocessing run.

seed = 42
output_dir = "../outputs/classification"

# Class encoding: 0 = MSA-P, 1 = PD. Sensitivity is therefore PD recall.
positive_label = 1

[data]
manifest = "../data/example_manifest.csv"
root = ".."
image_column = "fused_path"
slice_offsets = [-2, -1, 0, 1, 2]
expected_slices = 5
# Zero-based indices on a canonical axial grid. Each subject has its own center.
slice_axis = 2
slice_index_base = 0
center_selection = "largest_striatal_roi_area"
image_size = 384

[splits]
n_folds = 4
stratified = true
assignments_file = "../outputs/classification/fold_assignments.csv"

[model]
name_or_path = "google/vit-base-patch16-384"
num_labels = 2
local_files_only = false
# The ImageNet checkpoint has a 1000-class head; replace only that head with 2 outputs.
ignore_mismatched_sizes = true

[training]
epochs = 150
batch_size = 32
optimizer = "adam"
learning_rate = 0.001
weight_decay = 0.0
num_workers = 4
amp = false
selection_metric = "val_accuracy"

# Optional training-only augmentation.
[augmentation]
enabled = false
rotation_degrees = 5.0
translation_fraction = 0.02
scale_min = 0.95
scale_max = 1.05
brightness = 0.10
contrast = 0.10
horizontal_flip_probability = 0.0

# Allowed: none, weighted_sampler, class_weighted_loss, both.
[imbalance]
strategy = "none"

[voting]
method = "weighted_soft"
# Ordered by slice_offset: center-2, center-1, center, center+1, center+2.
weights = [0.10, 0.20, 0.40, 0.20, 0.10]
patient_threshold = 0.50
# false applies a strict score > threshold decision rule.
threshold_inclusive = false

[gradcam]
# Default Grad-CAM class and ViT encoder layer.
target_class = 1
target_layer_index = 8
